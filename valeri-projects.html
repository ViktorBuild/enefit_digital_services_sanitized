<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VALERI Projekte - enefit</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #f0f9ff 0%, #ecf4f4 100%);
            min-height: 100vh;
            color: #1f2937;
            padding: 34px 16px;
        }
        .page { max-width: 1260px; margin: 0 auto; }
        .shell {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid #e5e7eb;
            border-radius: 22px;
            box-shadow: 0 18px 45px rgba(15, 23, 42, 0.06);
            padding: 28px;
        }
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 20px;
            flex-wrap: wrap;
            border-bottom: 1px solid #e5e7eb;
            padding-bottom: 20px;
            margin-bottom: 22px;
        }
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 16px;
            border-radius: 12px;
            border: 1px solid rgba(223, 244, 94, 0.35);
            background: rgba(223, 244, 94, 0.12);
            color: #111827;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.92rem;
            transition: all 0.25s ease;
        }
        .back-link:hover { transform: translateY(-2px); background: rgba(223, 244, 94, 0.2); }
        h1 { font-size: clamp(1.6rem, 3vw, 2.2rem); margin-bottom: 8px; }
        .lead { color: #4b5563; line-height: 1.6; max-width: 860px; }
        
        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        
        .project-card {
            border: 1px solid #e5e7eb;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.97), rgba(248, 250, 252, 0.92));
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 8px 22px rgba(15, 23, 42, 0.045);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        
        .project-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 30px rgba(15, 23, 42, 0.1);
            border-color: #dff45e;
        }
        
        .project-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            gap: 12px;
        }
        
        .project-name {
            font-weight: 700;
            font-size: 1.1rem;
            color: #111827;
            flex: 1;
            word-break: break-word;
        }
        
        .project-idea {
            color: #6b7280;
            font-size: 0.9rem;
            line-height: 1.5;
            margin: 8px 0;
        }
        
        .project-meta {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: #9ca3af;
            padding-top: 12px;
            border-top: 1px solid #e5e7eb;
        }
        
        .project-actions {
            display: flex;
            gap: 8px;
        }
        
        .btn {
            padding: 8px 14px;
            border: none;
            border-radius: 8px;
            font-weight: 500;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s ease;
            flex: 1;
            text-align: center;
            text-decoration: none;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #dff45e 0%, #bfe541 100%);
            color: #111;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(223, 244, 94, 0.3);
        }
        
        .btn-secondary {
            background: #f3f4f6;
            color: #374151;
            border: 1px solid #d1d5db;
        }
        
        .btn-secondary:hover {
            background: #e5e7eb;
        }
        
        .btn-danger {
            background: #fee2e2;
            color: #dc2626;
            border: 1px solid #fecaca;
        }
        
        .btn-danger:hover {
            background: #fecaca;
        }
        
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #6b7280;
        }
        
        .empty-state h2 {
            font-size: 1.5rem;
            margin-bottom: 12px;
            color: #374151;
        }
        
        .empty-state p {
            margin-bottom: 24px;
        }
        
        .status-badge {
            display: inline-block;
            padding: 4px 10px;
            background: #f0f9ff;
            color: #0369a1;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        
        .loading {
            text-align: center;
            padding: 40px 20px;
            color: #6b7280;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #e5e7eb;
            border-top-color: #dff45e;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="page">
        <div class="shell">
            <div class="topbar">
                <div>
                    <a href="/dashboard" class="back-link">← Zurück zum Dashboard</a>
                    <h1>VALERI Projekte</h1>
                    <p class="lead">Verwalte und überwache Deine VALERI-Analysen (Phase 1 & Phase 7)</p>
                </div>
            </div>

            <div id="projectsContainer"></div>
        </div>
    </div>

    <script>
        const projectsContainer = document.getElementById('projectsContainer');

        async function loadProjects() {
            projectsContainer.innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Projekte werden geladen...</p>
                </div>
            `;

            try {
                const response = await fetch('/api/valeri/projects');
                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Fehler beim Laden der Projekte');
                }

                if (!data.projects || data.projects.length === 0) {
                    projectsContainer.innerHTML = `
                        <div class="empty-state">
                            <h2>Keine Projekte gefunden</h2>
                            <p>Starten Sie Phase 1, um ein neues Projekt zu erstellen.</p>
                            <a href="/valeri/phase-1" class="btn btn-primary" style="display: inline-block; padding: 12px 24px; text-decoration: none;">
                                Neue VALERI-Analyse starten
                            </a>
                        </div>
                    `;
                    return;
                }

                const projectsHtml = data.projects.map(project => {
                    const idealDate = new Date(project.createdAt);
                    const dateStr = idealDate.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric' });
                    
                    return `
                        <div class="project-card">
                            <div class="project-header">
                                <div class="project-name">${escapeHtml(project.name)}</div>
                                <div class="status-badge">${project.scenarioCount || 0} Szenarien</div>
                            </div>
                            <div class="project-idea">${escapeHtml(project.idea)}</div>
                            <div class="project-meta">
                                <span>Erstellt: ${dateStr}</span>
                            </div>
                            <div class="project-actions">
                                <a href="/valeri/phase-7?projectId=${project.projectId}" class="btn btn-primary">Phase 7 öffnen</a>
                                <button onclick="deleteProject('${project.projectId}')" class="btn btn-danger">Löschen</button>
                            </div>
                        </div>
                    `;
                }).join('');

                projectsContainer.innerHTML = `
                    <div class="projects-grid">
                        ${projectsHtml}
                    </div>
                `;
            } catch (error) {
                projectsContainer.innerHTML = `
                    <div class="empty-state">
                        <h2>Fehler beim Laden</h2>
                        <p>${escapeHtml(error.message || 'Unbekannter Fehler')}</p>
                        <button onclick="loadProjects()" class="btn btn-primary" style="padding: 12px 24px;">Erneut versuchen</button>
                    </div>
                `;
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        async function deleteProject(projectId) {
            if (!confirm('Dieses Projekt und alle Szenarien wirklich löschen?')) {
                return;
            }

            try {
                const response = await fetch(`/api/valeri/projects/${projectId}`, {
                    method: 'DELETE'
                });

                if (!response.ok) {
                    const data = await response.json();
                    throw new Error(data.error || 'Fehler beim Löschen');
                }

                loadProjects(); // Reload project list
            } catch (error) {
                alert('Fehler beim Löschen: ' + error.message);
            }
        }

        // Load projects on page load
        loadProjects();
    </script>
</body>
</html>
